<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing ceremony (demo)</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #f5f6f8; color: #1d1d1f; }
    .doc { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .sig { border: 2px dashed #f5b301; border-radius: 6px; padding: 12px; margin-top: 12px; }
    button { font-size: 16px; padding: 12px 16px; border-radius: 6px; border: 0; margin-right: 8px; }
    .primary { background: #4c00ff; color: #fff; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="doc">
    <h2 id="title">Envelope</h2>
    <p>This is a demo signing page served from the SDK's assets over an https origin.
       It talks to the app only through the origin-restricted <code>DSBridge</code>.</p>
    <div class="sig">Sign here ✍️</div>
  </div>
  <button class="primary" id="sign">Finish signing</button>
  <button id="decline">Decline</button>
  <input id="reason" placeholder="Reason for declining (optional)">
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('title').textContent = 'Envelope ' + (params.get('envelopeId') || '');
    function post(msg) { if (window.DSBridge) DSBridge.postMessage(JSON.stringify(msg)); }
    window.addEventListener('load', () => post({ type: 'page_viewed' }));
    document.getElementById('sign').onclick = () => {
      post({ type: 'signing_complete' });
      post({ type: 'signing_complete' }); // duplicate on purpose: the SDK must deliver ONE result
    };
    document.getElementById('decline').onclick = () =>
      post({ type: 'declined', reason: document.getElementById('reason').value });
  </script>
</body>
</html>
